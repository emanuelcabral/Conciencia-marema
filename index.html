<style>
:root{
  --navy:#0D1B2A; --green:#12F693; --mag:#CF30FF;
  --bg:#FFFFFF; --surface:#F8F9FA; --ink:#0D1B2A; --muted:#4F5D6B; --line:#DDE2E8;
  --purple-bg:#F5E6FF; --purple-fg:#8A12B8;
  --green-bg:#E8FFF5; --green-fg:#0A7A4C;
  --gray-bg:#EEF1F4; --gray-fg:#33414F;
  --navy-bg:#0D1B2A; --navy-fg:#12F693;
  --disp:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --kick:'Antonio','Arial Narrow',Impact,sans-serif;
  --text:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08121D; --surface:#102131; --ink:#EAF0F6; --muted:#9FB0C0; --line:#1F3347;
    --purple-bg:#2F1A42; --purple-fg:#E3A6FF;
    --green-bg:#0F3326; --green-fg:#7DF5BF;
    --gray-bg:#1A2B3C; --gray-fg:#C4D0DC;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08121D; --surface:#102131; --ink:#EAF0F6; --muted:#9FB0C0; --line:#1F3347;
  --purple-bg:#2F1A42; --purple-fg:#E3A6FF;
  --green-bg:#0F3326; --green-fg:#7DF5BF;
  --gray-bg:#1A2B3C; --gray-fg:#C4D0DC;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:1.05rem;line-height:1.55}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--mag);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
[data-cat="ia"],[data-cat="dis"],[data-cat="com"]{--tb:var(--purple-bg);--tf:var(--purple-fg)}
[data-cat="edu"],[data-cat="car"],[data-cat="otr"]{--tb:var(--green-bg);--tf:var(--green-fg)}
[data-cat="her"],[data-cat="prog"],[data-cat="tec"]{--tb:var(--gray-bg);--tf:var(--gray-fg)}
[data-cat="eti"],[data-cat="rob"],[data-cat="act"]{--tb:var(--navy-bg);--tf:var(--navy-fg)}

/* Marco de marca: línea verde arriba, magenta abajo */
.bar-top{height:6px;background:var(--green)}
.bar-bot{height:6px;background:var(--mag)}

/* Portada / cabecera */
.nav-top{background:var(--navy);color:#fff}
.nav-top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;min-height:62px}
.logo{font-family:var(--disp);font-weight:900;font-size:1.1rem;letter-spacing:-.01em;color:#fff}
.logo b{color:var(--mag);font-weight:900}
.menu{display:flex;align-items:center;gap:6px}
.menu a{font:700 .95rem var(--text);padding:8px 15px;border-radius:999px;color:#fff}
.menu a:hover{color:var(--green)}
.menu a.cta{background:var(--green);color:var(--navy)}
.menu a.cta:hover{background:#fff;color:var(--navy)}
.menu a.brand{display:flex;padding:0 0 0 10px}
.brand img{height:40px;width:auto;display:block}
.mini-row{margin-top:18px}
.sbtns{display:flex;flex-wrap:wrap;gap:10px}
.sb{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;font:800 .96rem var(--text);color:#fff;padding:7px 18px 7px 7px;border-radius:999px;transition:transform .15s,filter .15s}
.sb:hover{transform:translateY(-3px);filter:brightness(1.08)}
.sb i{font-style:normal;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.24);font-family:var(--disp);font-weight:900;font-size:.9rem;line-height:1}
.sb.dk i{background:rgba(0,0,0,.14)}
.sb.mini{padding:5px}
.sb.mini i{background:transparent}
.sb.wa{background:#25D366;color:#062B14}
.sb.fb{background:#1877F2}
.sb.x{background:#000;box-shadow:0 0 0 1.5px #3A4C5F}
.sb.li{background:#0A66C2}
.sb.tg{background:#29B6F6;color:#04222F}
.sb.ml{background:var(--mag)}
.sb.cp{background:var(--green);color:var(--navy)}
.sb.nt{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.share{max-width:46rem;margin:0 auto;padding:0 20px 56px}
.share-box{background:var(--navy);color:#fff;border-radius:24px;padding:30px 28px;position:relative;overflow:hidden}
.share-box>*{position:relative;z-index:1}
.share-box::after{content:"";position:absolute;right:-34px;top:-34px;width:96px;height:96px;border-radius:50%;background:var(--mag)}
.share-box h2{font-family:var(--disp);font-weight:900;font-size:1.6rem;letter-spacing:-.01em;color:var(--green);margin:0 0 6px}
.share-box p{margin:0 0 22px;color:#C9D4DF}
.mast .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:44px;align-items:center;padding-top:56px;padding-bottom:28px}
.mast .tag{display:inline-block;margin-bottom:20px;background:var(--green-bg);color:var(--green-fg);font-family:var(--kick);font-weight:600;font-size:1.1rem;letter-spacing:.04em;padding:3px 14px;border-radius:999px}
.mast h1{font-family:var(--disp);font-weight:900;font-size:clamp(2.6rem,8vw,5.2rem);line-height:.96;letter-spacing:-.03em;color:var(--ink);margin:0}
.mast h1 .ia{display:inline-block;background:var(--mag);color:#fff;border-radius:.16em;padding:0 .1em;transform:rotate(-3deg)}
.mast p{max-width:30rem;margin:22px 0 0;color:var(--muted);font-size:1.15rem}
.panel{background:var(--purple-bg);border-radius:28px;aspect-ratio:4/3;position:relative;overflow:hidden;color:var(--ink)}
.panel svg{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:760px){.mast .wrap{grid-template-columns:1fr;gap:28px;padding-top:36px}.panel{aspect-ratio:16/9}}
@media (max-width:480px){.logo{font-size:.95rem}.menu a{padding:7px 11px;font-size:.9rem}}
.kick{font-family:var(--kick);font-weight:600;font-size:1.25rem;letter-spacing:.04em;color:#fff;margin:0 0 14px}
.hero h1{font-family:var(--disp);font-weight:900;font-size:clamp(2.5rem,9vw,5.4rem);line-height:.98;letter-spacing:-.025em;color:var(--green);margin:0}
.hero h1 b{color:var(--mag);font-weight:900}
.hero p.sub{max-width:36rem;margin:18px 0 0;color:#C9D4DF;font-size:1.1rem}
.hashtag{margin-top:26px;font-family:var(--kick);font-weight:600;letter-spacing:.06em;color:var(--green)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 24px}
.chip{border:2px solid var(--line);background:transparent;color:var(--ink);font:700 .92rem var(--text);padding:7px 16px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--mag)}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--green);border-color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--green);color:var(--navy);border-color:var(--green)}}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--green);color:var(--navy);border-color:var(--green)}

/* Listado */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-bottom:56px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:var(--mag)}
.thumb{aspect-ratio:16/9;background:var(--navy);position:relative;overflow:hidden}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.pill{align-self:flex-start;background:var(--tb);color:var(--tf);font-family:var(--kick);font-weight:600;font-size:1rem;letter-spacing:.04em;padding:2px 12px;border-radius:999px}
.card h2{font-family:var(--disp);font-weight:900;font-size:1.15rem;line-height:1.22;letter-spacing:-.01em;margin:0}
.card p{margin:0;color:var(--muted);font-size:.98rem}
.meta{margin-top:auto;padding-top:6px;color:var(--muted);font-size:.85rem;font-weight:600;display:flex;justify-content:space-between}
.card.feat{grid-column:span 3;flex-direction:row;background:var(--navy);border-color:var(--navy);color:#fff}
.card.feat .thumb{flex:1.05;aspect-ratio:auto;min-height:290px;background:#122539}
.card.feat .body{flex:1;padding:34px;justify-content:center}
.card.feat h2{font-size:clamp(1.5rem,3vw,2.25rem);line-height:1.1;color:var(--green)}
.card.feat p{color:#C9D4DF;font-size:1.08rem}
.card.feat .meta{color:#9FB0C0;margin-top:8px}
.card.feat:hover{border-color:var(--mag)}
.empty{grid-column:1/-1;color:var(--muted);padding:40px 0}

/* Nota abierta */
.art-head{background:var(--bg);color:var(--ink)}
.art-head .in{max-width:46rem;margin:0 auto;padding:30px 20px 28px}
.back{display:inline-block;font-family:var(--kick);font-weight:600;font-size:1.1rem;letter-spacing:.04em;color:var(--ink);padding:4px 0;margin-bottom:26px}
.back:hover{color:var(--mag)}
.art-head h1{font-family:var(--disp);font-weight:900;font-size:clamp(1.9rem,5.5vw,3.1rem);line-height:1.06;letter-spacing:-.025em;color:var(--ink);margin:16px 0 16px}
.art-head .lead{font-size:1.2rem;color:var(--muted);margin:0 0 18px}
.art-head .by{display:flex;gap:16px;color:var(--muted);font-weight:600;font-size:.92rem}
.shot{max-width:46rem;margin:0 auto;padding:0 30px 0 20px}
.shot .img{aspect-ratio:16/8;border-radius:22px;background:var(--navy);position:relative;overflow:hidden;box-shadow:10px 10px 0 var(--green)}
.shot .img svg{position:absolute;inset:0;width:100%;height:100%}
.more{border-top:1.5px solid var(--line);padding:44px 0 56px}
.more>.wrap>h2{font-family:var(--disp);font-weight:900;font-size:1.6rem;letter-spacing:-.01em;margin:0 0 20px}
.more .grid{padding-bottom:0}
.art{max-width:46rem;margin:0 auto;padding:36px 20px 64px}
.txt p{font-size:1.15rem;line-height:1.75;margin:0 0 1.15em;max-width:42rem}
.txt h3{font-family:var(--disp);font-weight:900;font-size:1.5rem;letter-spacing:-.01em;margin:1.7em 0 .3em;padding-bottom:8px;border-bottom:3px solid var(--green)}
.txt h3{display:block}
.box{border-radius:14px;padding:18px 22px;margin:1.6em 0}
.box strong{display:block;font-family:var(--disp);font-weight:900;font-size:1.02rem;margin-bottom:4px}
.box p{margin:0!important;font-size:1.05rem!important;line-height:1.6!important}
.box.purple{background:var(--purple-bg);color:var(--ink)}
.box.purple strong{color:var(--purple-fg)}
.box.green{background:var(--green-bg);color:var(--ink)}
.box.green strong{color:var(--green-fg)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:44px;padding-top:28px;border-top:1.5px solid var(--line)}
.nav a{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.nav a:hover{border-color:var(--mag)}
.nav small{color:var(--muted);font-family:var(--kick);font-weight:600;font-size:.95rem;letter-spacing:.04em}
.nav a:last-child{text-align:right}
.nav span{font-family:var(--disp);font-weight:900;font-size:.98rem;line-height:1.25}

footer{background:var(--navy);color:#9FB0C0;padding:36px 0 30px}
footer .wrap{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.foot-name{font-family:var(--disp);font-weight:900;font-size:1.2rem;color:#fff}
.foot-name b{color:var(--mag);font-weight:900}
.social{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.social a{font:700 .9rem var(--text);color:#fff;border:1.5px solid #2A3F55;border-radius:999px;padding:6px 15px}
.social a:hover{border-color:var(--green);color:var(--green)}
footer small{font-size:.9rem;color:#9FB0C0}

@media (max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}.card.feat{grid-column:span 2}}
@media (max-width:620px){
  .grid{grid-template-columns:1fr}
  .card.feat{grid-column:auto;flex-direction:column}
  .card.feat .thumb{min-height:0;aspect-ratio:16/9;flex:none}
  .card.feat .body{padding:20px}
  .nav{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ic{width:18px;height:18px;display:block;fill:currentColor}
.social a{width:46px;height:46px;padding:0;display:grid;place-items:center;border-radius:50%}
.social .ic{width:21px;height:21px}
.social a:hover{background:var(--green);border-color:var(--green);color:var(--navy)}
.thumb img,.shot .img img,.pv-s .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pv-s .im svg{position:absolute;inset:0;width:100%;height:100%}
.secret{position:absolute;left:36%;top:33%;width:28%;height:34%;display:block;opacity:0;cursor:default}
.pager{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 0 64px}
.pg{min-width:46px;height:46px;padding:0 16px;display:grid;place-items:center;border:2px solid var(--line);border-radius:999px;font-weight:800;font-size:.95rem}
a.pg:hover{border-color:var(--mag)}
.pg.on{background:var(--navy);color:var(--green);border-color:var(--navy)}
.pg.off{opacity:.4}.pg.dots{border-color:transparent}
:root{--btn-bg:#0D1B2A;--btn-fg:#12F693}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--btn-bg:#12F693;--btn-fg:#0D1B2A}.pg.on{background:var(--green);color:var(--navy);border-color:var(--green)}}
.btn{font:800 .95rem var(--text);border:2px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg);border-radius:999px;padding:10px 20px;cursor:pointer;display:inline-block}
.btn:hover{border-color:var(--mag)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 14px;font-size:.85rem}
.btn.danger{background:transparent;color:#C21F4B;border-color:#C21F4B}
.btn.ok{background:var(--green);color:var(--navy);border-color:var(--green)}
.adm{padding-top:36px;padding-bottom:64px}
.adm h1,.login h1{font-family:var(--disp);font-weight:900;font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:-.02em;margin:0}
.adm-top{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.adm-top p{margin:6px 0 0;color:var(--muted)}
.adm-act{display:flex;flex-wrap:wrap;gap:8px}
.tbl{border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto auto;gap:12px 18px;align-items:center;padding:14px 18px;border-top:1.5px solid var(--line);background:var(--surface)}
.row:first-child{border-top:0}
.r-main strong{display:block;font-family:var(--disp);font-weight:900;line-height:1.25}
.r-sub{color:var(--muted);font-size:.85rem}
.st{font-family:var(--kick);font-weight:600;letter-spacing:.04em;font-size:1rem;padding:2px 12px;border-radius:999px;white-space:nowrap}
.st-publicada{background:var(--green-bg);color:var(--green-fg)}
.st-pendiente{background:var(--purple-bg);color:var(--purple-fg)}
.st-borrador{background:var(--gray-bg);color:var(--gray-fg)}
.r-act{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.login{max-width:26rem;margin:56px auto 72px;display:grid;gap:14px}
.login p{margin:0;color:var(--muted)}
.lnk{color:var(--muted);font-weight:700}
label.f{display:grid;gap:6px;font-weight:800;font-size:.92rem}
.f input,.f select,.f textarea{font:500 1rem var(--text);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 14px;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--mag);outline:none}
.f small{font-weight:600;color:var(--muted)}
.err{color:#C21F4B!important;font-weight:700;min-height:1.2em}
.ed{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:start;margin-top:22px}
.ed-col{display:grid;gap:16px}
.box2{border:1.5px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;background:var(--surface)}
.box2 h2{margin:0;font-family:var(--disp);font-weight:900;font-size:1.1rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tools{margin-top:22px}
.tools summary{cursor:pointer;font-weight:800}
.tools textarea{width:100%;min-height:140px;font:500 .85rem monospace;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px}
.pv-g{border-radius:12px;padding:14px;background:#fff;color:#202124;font-family:Arial,sans-serif}
.pv-g .u{color:#006621;font-size:.85rem}.pv-g .t{color:#1a0dab;font-size:1.15rem;line-height:1.3}.pv-g .d{color:#4d5156;font-size:.9rem}
.pv-s{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.pv-s .im{aspect-ratio:1200/630;background:var(--navy);position:relative}
.pv-s .tx{padding:10px 14px;display:grid;gap:2px}.pv-s small{color:var(--muted)}.pv-s b{font-family:var(--disp)}
.msg{font-weight:800;color:var(--green-fg);min-height:1.2em;margin:12px 0 0}
.prev-banner{background:var(--purple-bg);color:var(--purple-fg);font-weight:800;text-align:center;padding:10px 20px}
@media (max-width:860px){.ed{grid-template-columns:1fr}}
@media (max-width:760px){.row{grid-template-columns:1fr}.r-act{justify-content:flex-start}}
</style>

  var $=function(i){return document.getElementById(i);},slT=!!n;
  function pv(){
    var t=$('st').value||$('t').value||'Título de la nota',e=$('sd').value||$('e').value||'Descripción de la nota',sl=$('sl').value||slug($('t').value)||'titulo';
    $('ce').textContent=$('e').value.length+'/160';$('cst').textContent=$('st').value.length+'/60';$('csd').textContent=$('sd').value.length+'/160';
    $('pg').innerHTML='<div class="u">www.tecnomarema.com.ar › '+esc(sl)+'</div><div class="t">'+esc((t+' | ConciencIA Marema').slice(0,62))+'</div><div class="d">'+esc(e.slice(0,160))+'</div>';
    $('ps').innerHTML='<div class="im">'+(cim?'<img src="'+esc(cim)+'" alt="">':art($('cat').value))+'</div><div class="tx"><small>conciencia marema</small><b>'+esc(t)+'</b><small>'+esc(e.slice(0,110))+'</small></div>';
  }
  app.querySelectorAll('input,textarea,select').forEach(function(i){i.addEventListener('input',pv);});
  $('t').addEventListener('input',function(){if(!slT){$('sl').value=slug($('t').value);pv();}});
  $('sl').addEventListener('input',function(){slT=true;});
  $('fi').onchange=function(){
    var f=this.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){var w=Math.min(1200,im.width),h=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);cim=c.toDataURL('image/jpeg',.8);$('iu').value='';pv();};im.src=r.result;};
    r.readAsDataURL(f);
  };
  $('iu').oninput=function(){cim=this.value.trim();};
  $('qi').onclick=function(){cim='';$('iu').value='';$('fi').value='';pv();};
  function save(volver){
    var v=function(i){return $(i).value;},t=v('t').trim(),msg=$('msg');
    if(!t){msg.textContent='Falta el título.';return;}
    var id=slug(v('sl')||t);
    if(!id||RES.indexOf(id)>-1||/^pagina-\d+$/.test(id)){msg.textContent='Ese enlace no se puede usar. Probá con otro.';return;}
    if(NOTAS.some(function(x){return x.id===id&&x.id!==editId;})){msg.textContent='Ya existe otra nota con ese enlace.';return;}
    var o=norm({id:id,t:t,cat:v('cat'),estado:v('est'),iso:v('iso')||undefined,e:v('e').trim(),b:textToBlocks(v('txt')),img:cim,alt:v('alt').trim(),origen:d.origen,seo:{title:v('st').trim(),desc:v('sd').trim(),kw:v('kw').trim()}});
    var i=NOTAS.map(function(x){return x.id;}).indexOf(editId);
    if(i>-1)NOTAS[i]=o;else NOTAS.push(o);
    editId=id;
    if(!guardar()){msg.textContent='No se pudo guardar: el navegador se quedó sin espacio. Probá con una imagen más liviana.';return;}
    if(volver){location.hash='panel';}else{msg.textContent='Guardado.';}
  }
  $('g1').onclick=function(){save(false);};
  $('g2').onclick=function(){save(true);};
  pv();
}

function ic(k){return '<svg class="ic" aria-hidden="true"><use href="#i-'+k+'"/></svg>';}
function compartir(n,mini){
  var u=encodeURIComponent(location.href),t=encodeURIComponent(n.t);
  var L=[['wa dk','wa','WhatsApp','https://wa.me/?text='+t+'%20'+u],
   ['fb','fb','Facebook','https://www.facebook.com/sharer/sharer.php?u='+u],
   ['x','x','X','https://x.com/intent/post?text='+t+'&amp;url='+u],
   ['li','li','LinkedIn','https://www.linkedin.com/sharing/share-offsite/?url='+u],
   ['tg dk','tg','Telegram','https://t.me/share/url?url='+u+'&amp;text='+t],
   ['ml','ml','Email','mailto:?subject='+t+'&amp;body='+t+'%0A'+u]];
  var h=L.map(function(s){return '<a class="sb '+s[0]+(mini?' mini':'')+'" href="'+s[3]+'" target="_blank" rel="noopener" aria-label="Compartir en '+s[2]+'"><i>'+ic(s[1])+'</i>'+(mini?'':s[2])+'</a>';}).join('');
  h+='<button type="button" class="sb cp dk'+(mini?' mini':'')+'" data-copy aria-label="Copiar enlace"><i>'+ic('cp')+'</i><span>'+(mini?'':'Copiar enlace')+'</span></button>';
  if(navigator.share)h+='<button type="button" class="sb nt'+(mini?' mini':'')+'" data-native aria-label="Más opciones"><i>'+ic('nt')+'</i>'+(mini?'':'Más opciones')+'</button>';
  return h;
}
function copiar(txt,b){
  function ok(){var i=b.querySelector('i'),s=b.querySelector('span'),a=i.innerHTML,c=s?s.textContent:'';i.textContent='✅';if(s&&c)s.textContent='¡Copiado!';setTimeout(function(){i.innerHTML=a;if(s)s.textContent=c;},2000);}
  function viejo(){var t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok();}catch(e){}document.body.removeChild(t);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,viejo);}else{viejo();}
}
function nota(id){
  var n=NOTAS.filter(function(x){return x.id===id;})[0];
  if(!n||(n.estado!=='publicada'&&!esAdmin())){pag=1;lista();return;}
  seo({title:(n.seo.title||n.t)+' | ConciencIA Marema',desc:n.seo.desc||n.e,kw:n.seo.kw,type:'article',img:n.img,note:n,noindex:n.estado!=='publicada'});
  var rel=pub().filter(function(x){return x.id!==n.id;}).sort(function(a,b){return (b.cat===n.cat)-(a.cat===n.cat);}).slice(0,3);
  app.innerHTML=(n.estado!=='publicada'?'<div class="prev-banner">Vista previa: esta nota todavía no es pública ('+n.estado+').</div>':'')+
    '<header class="art-head" data-cat="'+n.cat+'"><div class="in"><a class="back" href="#">← Todas las notas</a><br>'+
    '<span class="pill">'+CATS[n.cat]+'</span><h1>'+esc(n.t)+'</h1><p class="lead">'+esc(n.e)+'</p>'+
    '<div class="by"><time datetime="'+n.iso+'">'+n.fecha+'</time></div><div class="sbtns mini-row">'+compartir(n,true)+'</div></div></header>'+
    '<div class="shot" data-cat="'+n.cat+'"><div class="img">'+pic(n)+'</div></div>'+
    '<article class="art"><div class="txt">'+n.b.map(bloque).join('')+'</div></article>'+
    '<section class="share"><div class="share-box"><h2>Compartí esta nota</h2><p>Un toque y llega a tus contactos y redes.</p><div class="sbtns">'+compartir(n,false)+'</div></div></section>'+
    (rel.length?'<section class="more"><div class="wrap"><h2>Seguí leyendo</h2><div class="grid">'+rel.map(function(r){return tarjeta(r,false);}).join('')+'</div></div></section>':'');
  app.querySelectorAll('[data-copy]').forEach(function(b){b.addEventListener('click',function(){copiar(location.href,b);});});
  app.querySelectorAll('[data-native]').forEach(function(b){b.addEventListener('click',function(){try{var p=navigator.share({title:n.t,text:n.e,url:location.href});if(p&&p.catch)p.catch(function(){});}catch(e){}});});
}

function ruta(){
  var h=decodeURIComponent(location.hash.replace('#','')),m=/^pagina-(\d+)$/.exec(h);
  if(h==='admin'){login();}
  else if(h==='panel'){panel();}
  else if(h==='editor'){editor();}
  else if(m){pag=+m[1];lista();}
  else if(h){nota(h);}
  else{pag=1;lista();}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',ruta);
ruta();
</script>
</body>
